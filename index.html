<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creadores AWS Builder Center | AWS UG Playa Vicente</title>
    <meta name="description" content="Iniciativa comunitaria para descubrir, leer y apoyar artículos técnicos de creadores en AWS Builder Center y redes profesionales." />
    
    <!-- Open Graph / LinkedIn / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AWS User Group Playa Vicente" />
    <meta property="og:url" content="https://creadores.awsugplayavicente.com/" />
    <meta property="og:title" content="Hub Comunitario de Creadores | AWS Builder Center" />
    <meta property="og:description" content="Iniciativa de apoyo mutuo, checklist interactivo y difusión de artículos técnicos para creadores del AWS Builder Center LATAM." />
    <meta property="og:image" content="https://creadores.awsugplayavicente.com/images/og-banner.png" />
    <meta property="og:image:secure_url" content="https://creadores.awsugplayavicente.com/images/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hub Comunitario de Creadores - AWS UG Playa Vicente" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hub Comunitario de Creadores | AWS Builder Center" />
    <meta name="twitter:description" content="Iniciativa de apoyo mutuo, checklist interactivo y difusión de artículos técnicos para creadores del AWS Builder Center LATAM." />
    <meta name="twitter:image" content="https://creadores.awsugplayavicente.com/images/og-banner.png" />
    
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Evitar FOUC / Flashazo Blanco: Aplica tema guardado inmediatamente -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('awsug_theme') || 'light';
          document.documentElement.className = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = saved === 'dark' ? '#080c16' : '#dbe2ea';
        } catch (e) {
          document.documentElement.style.backgroundColor = '#dbe2ea';
        }
      })();
    </script>
  </head>
  <body class="bg-background text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
