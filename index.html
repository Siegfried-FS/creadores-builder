<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creadores AWS Builder Center | AWS UG Playa Vicente</title>
    
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Evitar FOUC / Flashazo Blanco: Aplica tema guardado inmediatamente -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('awsug_theme') || 'dark';
          var valid = ['dark', 'light', 'tropical'].indexOf(saved) !== -1 ? saved : 'dark';
          document.documentElement.className = valid;
          if (valid === 'dark') {
            document.documentElement.style.backgroundColor = '#080c16';
          } else if (valid === 'tropical') {
            document.documentElement.style.backgroundColor = '#0f172a';
          } else {
            document.documentElement.style.backgroundColor = '#1e293b';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
